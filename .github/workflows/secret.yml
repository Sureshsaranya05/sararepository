name: env demo
on: push
env:
 app_name: ${{secrets.API_KEYSECRET}}
jobs:
  demo:
   runs-on: ubuntu-latest
   env:
     Environment: "testing"

   steps:
    - name: checkout repo
      uses: actions/checkout@v4

    - name:  Install Python
      uses: actions/setup-python@v5

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: run python
      run: python3 pythondemo.py
      
    - name: print variables
      env: 
       Greeting: "Hello"
      run: |
        echo "$Greeting from $app_name"
        echo "running in $Environment"
     
